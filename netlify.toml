# "Everything That Glows" is a static site — a landing page (index.html) plus the
# self-contained book (read.html). No build step.
[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Security headers, applied to every response.
# The site is fully self-contained: no external scripts, styles, images, fonts,
# frames, or network calls. The CSP below reflects that exactly. Inline <style>
# and <script> require 'unsafe-inline'; data: covers the embedded fonts and the
# SVG favicon. There is no user input and nothing is loaded cross-origin, so the
# XSS surface is effectively nil.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"

# Always revalidate the HTML so readers get the latest landing page and book.
# Netlify matches header rules against the request path, so "/" needs its own
# rule in addition to "/index.html".
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/read.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The share card changes rarely; let it cache for a week.
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Service worker: never cache it, so clients pick up updates promptly; allow
# root scope so it can control the whole site.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ---------------------------------------------------------------------------
# Canonical host: send www → the bare apex domain over HTTPS. Netlify also
# auto-provisions TLS and forces HTTPS once the custom domain is attached and
# everythingthatglows.com is set as the project's primary domain.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://www.everythingthatglows.com/*"
  to = "https://everythingthatglows.com/:splat"
  status = 301
  force = true
